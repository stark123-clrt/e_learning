<!DOCTYPE html>

</head>
<body>
<div class="app-shell">

  <aside class="sidebar" data-sidebar>
    <div class="brand-row">
      <div class="brand-mark" aria-hidden="true">e</div>
      <div>
        <div class="brand-name">e-learning</div>
        <div class="brand-role">Formateur</div>
      </div>
    </div>
    <nav class="nav-list" aria-label="Navigation principale">
      <a class="nav-item" href="dashboard.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Dashboard</span></a>
      <a class="nav-item" href="formations.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>Mes formations</span></a>
      <a class="nav-item active" href="notes.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg><span>Notes</span></a>
      <a class="nav-item" href="moyennes.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg><span>Moyennes</span></a>
      <a class="nav-item" href="profil.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profil</span></a>
      <a class="nav-item logout" href="../login.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Déconnexion</span></a>
    </nav>
    <div class="user-row">
      <div class="avatar avatar-md" aria-hidden="true">JR</div>
      <div style="min-width:0;">
        <div class="user-name">Julien Roy</div>
        <div class="user-role">Formateur</div>
      </div>
    </div>
  </aside>
  <div class="sidebar-backdrop" data-sidebar-backdrop></div>

  <div class="main-col">
    <header class="topbar">
      <div class="topbar-titles">
        <button class="menu-toggle" data-menu-toggle type="button" aria-label="Ouvrir le menu" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div>
          <div class="page-title">Notes</div>
          <div class="page-subtitle">Saisie des notes de vos étudiants</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="avatar avatar-sm" aria-hidden="true">JR</div>
      </div>
    </header>

    <main class="content">

      <div class="card">
        <div class="card-body">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <div class="card-title">Développement Web Full-Stack — saisie des notes</div>
            <div style="font-size:14px;color:var(--text-secondary);">Moyenne : <strong style="color:var(--text-primary);">16/20</strong></div>
          </div>
          <form style="display:flex;flex-direction:column;gap:12px;margin-top:16px;">
            <div style="display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--border);">
              <label style="flex:1;font-size:14px;color:var(--text-primary);" for="note-sm">Sophie Martin</label>
              <input class="input input-number" type="number" id="note-sm" min="0" max="20" placeholder="—">
            </div>
            <div style="display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--border);">
              <label style="flex:1;font-size:14px;color:var(--text-primary);" for="note-md">Marie Dupont</label>
              <input class="input input-number" type="number" id="note-md" min="0" max="20" value="15">
            </div>
            <div style="display:flex;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--border);">
              <label style="flex:1;font-size:14px;color:var(--text-primary);" for="note-hf">Hugo Fontaine</label>
              <input class="input input-number" type="number" id="note-hf" min="0" max="20" placeholder="—">
            </div>
            <div style="display:flex;align-items:center;gap:16px;padding:10px 0;">
              <label style="flex:1;font-size:14px;color:var(--text-primary);" for="note-ld">Léa Dubois</label>
              <input class="input input-number" type="number" id="note-ld" min="0" max="20" value="17">
            </div>
          </form>
          <div style="display:flex;justify-content:flex-end;margin-top:16px;">
            <button class="btn btn-primary" type="button">Enregistrer les notes</button>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>
<script src="../assets/js/app.js"></script>
</body>
</html>
