<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — e-learning</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:28px;">
      <a href="index.html" class="brand-mark" aria-label="Retour à l'accueil" style="text-decoration:none;">e</a>
      <div style="font-family:var(--font-display);font-weight:700;font-size:20px;">e-learning</div>
    </div>
    <form style="display:flex;flex-direction:column;gap:14px;" action="#" method="post">
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" placeholder="vous@email.fr" autocomplete="username">
      </div>
      <div class="field">
        <label class="field-label" for="password">Mot de passe</label>
        <input class="input" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div style="text-align:right;"><a href="#forgot" style="font-size:13px;">Mot de passe oublié ?</a></div>
      <button type="submit" class="btn btn-primary btn-block" style="height:44px;">Se connecter</button>
    </form>
    <div style="font-size:13px;color:var(--text-muted);text-align:center;margin-top:20px;">
      Pas encore de compte ? <a href="inscription.html">Créer un compte</a>
    </div>
    <div style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:16px;line-height:1.6;">Plateforme accessible aux profils <strong>Administrateur</strong>, <strong>Formateur</strong> et <strong>Étudiant</strong>.</div>
  </div>
</div>
</body>
</html>
